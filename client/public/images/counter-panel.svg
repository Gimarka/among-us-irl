<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan Outer Glow -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Background Gradient -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051520"/>
      <stop offset="100%" stop-color="#00070a"/>
    </linearGradient>

    <!-- Scanline Pattern Overlay -->
    <pattern id="scanlines1" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Main Angled Frame -->
  <polygon points="15,5 225,5 235,15 235,65 225,75 15,75 5,65 5,15"
           fill="url(#bg1)"
           stroke="#00f0ff"
           stroke-width="2"
           filter="url(#glow1)" />

  <!-- Digital Segment Overlay Texture -->
  <path d="M 55 10 L 55 70 M 105 10 L 105 70 M 155 10 L 155 70 M 205 10 L 205 70"
        stroke="#00f0ff"
        stroke-width="1"
        stroke-opacity="0.1" />

  <!-- Inner Scanlines -->
  <polygon points="15,5 225,5 235,15 235,65 225,75 15,75 5,65 5,15"
           fill="url(#scanlines1)"
           stroke="none"/>

  <!-- Corner Tech Detail -->
  <circle cx="230" cy="10" r="2.5" fill="#7be5ff" filter="url(#glow1)"/>
</svg>
