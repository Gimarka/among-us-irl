<svg width="340" height="80" viewBox="0 0 340 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="epicGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="titleBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18222d"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>

    <!-- Caution Hazard Stripes -->
    <pattern id="cautionStripes" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.8"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#000000" stroke-width="6"/>
    </pattern>
  </defs>

  <!-- Outer Heavy Frame -->
  <polygon points="5,5 335,5 335,20 325,30 325,50 335,60 335,75 5,75 5,60 15,50 15,30 5,20"
           fill="url(#titleBg2)"
           stroke="#00f0ff"
           stroke-width="2"
           filter="url(#epicGlow2)" />

  <!-- Left/Right Hazard Panels -->
  <polygon points="12,12 35,12 25,68 12,68" fill="url(#cautionStripes)" />
  <polygon points="328,12 305,12 315,68 328,68" fill="url(#cautionStripes)" />

  <!-- Inner Display Recess -->
  <polygon points="42,12 298,12 290,68 50,68"
           fill="#050a0f"
           stroke="#00f0ff"
           stroke-width="1"
           stroke-opacity="0.5"/>

  <!-- Corner Structural Bolts -->
  <circle cx="20" cy="20" r="2.5" fill="#7be5ff"/>
  <circle cx="320" cy="20" r="2.5" fill="#7be5ff"/>
  <circle cx="20" cy="60" r="2.5" fill="#7be5ff"/>
  <circle cx="320" cy="60" r="2.5" fill="#7be5ff"/>
</svg>
