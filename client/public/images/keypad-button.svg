<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Beveled Button Frame -->
  <polygon points="15,5 105,5 115,15 115,105 105,115 15,115 5,105 5,15"
           fill="url(#btnBg)"
           stroke="#00f0ff"
           stroke-width="2"
           filter="url(#cyanGlow)" />

  <!-- Inner Bevel/Border Detail -->
  <polygon points="18,10 102,10 110,18 110,102 102,110 18,110 10,102 10,18"
           fill="none"
           stroke="#00f0ff"
           stroke-width="1"
           stroke-opacity="0.3" />

  <!-- Corner Tech Accents -->
  <line x1="5" y1="25" x2="5" y2="35" stroke="#00f0ff" stroke-width="2" />
  <line x1="115" y1="85" x2="115" y2="95" stroke="#00f0ff" stroke-width="2" />
  <line x1="25" y1="115" x2="35" y2="115" stroke="#00f0ff" stroke-width="2" />
  <line x1="85" y1="5" x2="95" y2="5" stroke="#00f0ff" stroke-width="2" />
</svg>
