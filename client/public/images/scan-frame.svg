<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan Outer Glow -->
    <filter id="camGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Translucent Dark Monitor Feed Background -->
    <linearGradient id="feedBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02111a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00060a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Monitor Background Plate -->
  <rect x="10" y="10" width="300" height="300" rx="4" fill="url(#feedBg1)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Viewfinder Corner Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#camGlow1)"/>
  <path d="M 295 45 L 295 25 L 275 25" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#camGlow1)"/>
  <path d="M 25 275 L 25 295 L 45 295" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#camGlow1)"/>
  <path d="M 295 275 L 295 295 L 275 295" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#camGlow1)"/>

  <!-- REC Indicator -->
  <circle cx="35" cy="40" r="5" fill="#ff0055" filter="url(#redGlow)"/>

  <!-- Top/Bottom Data Lines -->
  <line x1="105" y1="18" x2="215" y2="18" stroke="#00f0ff" stroke-width="2" filter="url(#camGlow1)"/>
  <line x1="120" y1="302" x2="200" y2="302" stroke="#00f0ff" stroke-width="2" filter="url(#camGlow1)"/>
</svg>
