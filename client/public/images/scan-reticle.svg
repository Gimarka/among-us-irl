<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="camGlow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Targeting Crosshair -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4, 4"/>
  <line x1="35" y1="50" x2="45" y2="50" stroke="#00f0ff" stroke-width="1.5" filter="url(#camGlow1)"/>
  <line x1="55" y1="50" x2="65" y2="50" stroke="#00f0ff" stroke-width="1.5" filter="url(#camGlow1)"/>
  <line x1="50" y1="35" x2="50" y2="45" stroke="#00f0ff" stroke-width="1.5" filter="url(#camGlow1)"/>
  <line x1="50" y1="55" x2="50" y2="65" stroke="#00f0ff" stroke-width="1.5" filter="url(#camGlow1)"/>
</svg>
