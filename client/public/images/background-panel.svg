<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Steel Gradient -->
    <linearGradient id="hullMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e555d"/>
      <stop offset="50%" stop-color="#3a4047"/>
      <stop offset="100%" stop-color="#2a2e33"/>
    </linearGradient>

    <!-- Bevel Line Shadow -->
    <filter id="panelInset">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect width="400" height="400" fill="url(#hullMetal)"/>

  <!-- Panel Seam Lines -->
  <g stroke="#1a1d20" stroke-width="3" filter="url(#panelInset)">
    <line x1="280" y1="0" x2="280" y2="115"/>
    <line x1="0" y1="115" x2="400" y2="115"/>
    <line x1="55" y1="115" x2="55" y2="295"/>
    <line x1="0" y1="295" x2="400" y2="295"/>
    <line x1="260" y1="295" x2="260" y2="400"/>
  </g>

  <!-- Panel Highlight Edges -->
  <g stroke="#6b747e" stroke-width="1" opacity="0.5">
    <line x1="281" y1="0" x2="281" y2="114"/>
    <line x1="0" y1="116" x2="400" y2="116"/>
    <line x1="56" y1="116" x2="56" y2="294"/>
    <line x1="0" y1="296" x2="400" y2="296"/>
    <line x1="261" y1="296" x2="261" y2="400"/>
  </g>

  <!-- Industrial Bolts/Rivets -->
  <g fill="#22262a" stroke="#5a626a" stroke-width="1">
    <circle cx="270" cy="105" r="3"/>
    <circle cx="290" cy="125" r="3"/>
    <circle cx="65" cy="125" r="3"/>
    <circle cx="45" cy="285" r="3"/>
    <circle cx="250" cy="305" r="3"/>
    <circle cx="270" cy="285" r="3"/>
  </g>
</svg>
